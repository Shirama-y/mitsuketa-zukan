<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="図鑑ライブラリ">
<link rel="manifest" href="./manifest.webmanifest">
<title>わたしの図鑑ライブラリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  /* ============================================================
     いろの出どころ。ここだけ差し替えれば、画面全体の明るさが変わる。
     明るい紙の上に、柄の図鑑と写真が並ぶ、という見え方を狙う。
     背景は脇役にして、表紙・写真・文字を主役にする。
     ============================================================ */
  :root {
    color-scheme: light;

    /* ── 下地 ─────────────────────────────── */
    --ground: #f7f2ea;   /* 画面の地。やわらかい生成り */
    --tome:   #f3e9dc;   /* 図鑑の紙。くすんだクリーム */
    --card:   #fffcf8;   /* シート。白〜オフホワイト */
    --field:  #f4ece2;   /* 入力欄。地より少し濃い */
    --bar:    #f1e9de;   /* 下のバー */
    --shade:  #e8ded0;   /* 写真が入る前の場所 */

    /* ── 文字と罫。黒っぽさを避け、やわらかいトープに ───── */
    --ink:    #4a3f38;
    --muted:  #8a7c70;
    --line:   #e6dbcd;
    --rule:   #cbbcab;
    --alert:  #b05c4e;

    /* ── アクセント。くすませて、紙になじませる ───────── */
    --blue:   #56a8c2;
    --yellow: #edc55e;
    --cover:     var(--blue);   /* 図鑑ごとに JS が差し替える */
    --cover-ink: #0d2e3a;

    /* ── 紙の上で使う色。囲みの中に効く ─────── */
    --tome-ink:   #3a2f22;
    --tome-muted: #7d7060;
    --tome-line:  #e0d4b6;
    --tome-rule:  #c6b795;

    /* ── 物体。白い紙とシール ───────────────── */
    --sticker:     #ffffff;
    --sticker-ink: #322a1e;
    --sticker-sub: #8b8070;
    --plate:       #fffdf8;
    --plate-ink:   #2e2618;
    --plate-sub:   #776c5c;

    /* ── 影。机から紙が浮く程度にとどめる ───── */
    --lift:    0 1px 2px rgba(92, 74, 44, .10), 0 4px 10px rgba(92, 74, 44, .07);
    --lift-hi: 0 2px 4px rgba(92, 74, 44, .14), 0 10px 22px rgba(92, 74, 44, .12);

    --maru: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    --klee: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --kaku: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding-top: env(safe-area-inset-top, 0px);
    background-color: var(--ground);
    /* 紙のごく薄いムラ。背景は脇役なので、ここで主張させない。 */
    background-image:
      radial-gradient(ellipse 75% 45% at 14% 6%, rgba(255, 255, 255, .8), transparent 72%),
      radial-gradient(ellipse 55% 35% at 86% 38%, rgba(198, 183, 149, .13), transparent 72%),
      radial-gradient(ellipse 85% 35% at 42% 94%, rgba(198, 183, 149, .09), transparent 72%),
      repeating-linear-gradient(98deg, rgba(150, 130, 95, .02) 0 1px, transparent 1px 11px);
    color: var(--ink);
    font-family: var(--kaku);
    font-size: 16px;
    line-height: 1.8;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 860px; margin-inline: auto; padding-inline: 14px; padding-block: 16px 124px; }

  /* 紙の上は、暗いテーマでも紙の色のまま。囲みの中だけ色を入れ替える。 */
  .tome, .card {
    --ink: var(--tome-ink);
    --muted: var(--tome-muted);
    --line: var(--tome-line);
    --rule: var(--tome-rule);
    color: var(--ink);
  }

  /* 題字。丸みのある極太で、図鑑らしい重さは残す。
     Zen Maru Gothic は 900 を持つので、合成太字に頼らない。 */
  .display {
    font-family: var(--maru); font-weight: 900;
    letter-spacing: .015em; line-height: 1.32; overflow-wrap: anywhere;
  }
  h1 { margin: 0; font-size: clamp(23px, 6.4vw, 30px); }
  .lead { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; letter-spacing: .08em; }

  .back {
    display: inline-block; font-size: 13px; color: var(--muted);
    text-decoration: none; margin-bottom: 10px; padding: 3px 0;
  }
  .back:hover { color: var(--ink); }

  /* ================= 本だな ================= */
  .masthead { margin-bottom: 18px; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 26px 16px; }

  .bk { background: transparent; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: start; }
  .bk .cv {
    display: block; position: relative; aspect-ratio: 3 / 4; overflow: hidden;
    border-radius: 3px 7px 7px 3px; box-shadow: var(--lift);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .bk .cv > svg { display: block; width: 100%; height: 100%; }
  .bk .cv::after {
    content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 6px;
    background: linear-gradient(to right, rgba(0, 0, 0, .24), rgba(0, 0, 0, .04));
    pointer-events: none;
  }
  .cvplate {
    position: absolute; left: 12.7%; top: 35%; width: 74.6%; height: 30%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 6% 8%; text-align: center; color: var(--plate-ink);
  }
  .cvplate .t { font-size: clamp(12px, 3.2vw, 16px); }
  .cvplate .s {
    font-family: var(--kaku); font-weight: 500; font-size: 7.5px;
    letter-spacing: .16em; color: var(--plate-sub);
  }
  .bk .bkmeta { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .bk:hover .cv { box-shadow: var(--lift-hi); transform: translateY(-3px); }

  .newbk {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    aspect-ratio: 3 / 4; background: rgba(255, 255, 255, .6); color: var(--muted);
    border: 2px dashed var(--rule); border-radius: 4px;
    cursor: pointer; font: inherit; font-size: 12px; line-height: 1.5;
    text-align: center; text-wrap: balance; word-break: keep-all; padding: 10px;
  }
  .newbk .plus { font-size: 34px; line-height: 1; }
  .newbk:hover { color: var(--ink); border-color: var(--ink); }

  .firsttime {
    background: var(--tome); color: var(--tome-ink);
    border: 1px solid var(--tome-rule); border-radius: 3px;
    padding: 16px 18px; margin-bottom: 18px; box-shadow: var(--lift);
  }
  .firsttime p { margin: 0; font-family: var(--klee); font-weight: 600; font-size: 15px; }
  .firsttime span { display: block; font-size: 13px; color: var(--tome-muted); margin-top: 4px; }

  /* ================= 図鑑の中（いつでも明るいクラフト紙） ================= */
  .tome {
    position: relative; background-color: var(--tome);
    background-image:
      radial-gradient(ellipse 55% 40% at 22% 10%, rgba(255, 255, 255, .6), transparent 72%),
      radial-gradient(ellipse 45% 30% at 78% 44%, rgba(170, 150, 110, .09), transparent 72%),
      radial-gradient(ellipse 60% 26% at 42% 88%, rgba(255, 255, 255, .38), transparent 72%);
    border: 1px solid var(--tome-rule); border-radius: 3px;
    box-shadow: var(--lift); padding: 12px;
    max-width: 560px; margin-inline: auto;
  }
  /* 紙を留めたテープ。抽象的な帯だけで、絵は描かない。 */
  .tape {
    position: absolute; width: 58px; height: 19px; pointer-events: none;
    background: rgba(247, 198, 30, .34);
    box-shadow: inset 0 0 0 1px rgba(150, 118, 20, .13);
  }
  .tape.tl { top: -7px; left: -12px; transform: rotate(-38deg); }
  .tape.tr { top: -7px; right: -12px; transform: rotate(38deg); }
  .tape.bl { bottom: -7px; left: -12px; transform: rotate(38deg); }
  .tape.br { bottom: -7px; right: -12px; transform: rotate(-38deg); }
  /* 二重の飾り罫 */
  .tome::before {
    content: ""; position: absolute; inset: 7px;
    border: 2px solid var(--tome-rule); border-radius: 2px; pointer-events: none;
  }
  .tome::after {
    content: ""; position: absolute; inset: 12px;
    border: 1px solid var(--tome-rule); border-radius: 1px; opacity: .6; pointer-events: none;
  }
  .tomein { position: relative; padding: 14px 8px 12px; }

  .plate {
    background: var(--plate); color: var(--plate-ink);
    padding: 13px 20px 15px; text-align: center;
    box-shadow: var(--lift); margin-bottom: 16px;
  }
  .plate h1 { color: var(--plate-ink); }
  .plate .sub {
    font-size: 11px; color: var(--plate-sub); letter-spacing: .1em; margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  /* ================= 本のページ ================= */
  /* 表紙の柄を細い帯にして、ページの上に通す。外と中をつなぐ。 */
  .headband {
    position: absolute; inset-inline: 12px; top: 12px; height: 13px;
    overflow: hidden; border-radius: 2px 2px 0 0; opacity: .85;
  }
  .headband svg { display: block; width: 100%; height: 100%; }
  .tome { padding-top: 27px; }

  /* 罫で仕切った 3×3。紙の図鑑の組み方にならう。 */
  .pagegrid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    border-top: 1px solid var(--tint, var(--tome-rule));
    border-inline-start: 1px solid var(--tint, var(--tome-rule));
  }
  .pagegrid .cell {
    border-inline-end: 1px solid var(--tint, var(--tome-rule));
    border-block-end: 1px solid var(--tint, var(--tome-rule));
    min-width: 0; padding: 9px 6px 11px;
    display: flex; align-items: center; justify-content: center;
  }

  .st {
    display: flex; flex-direction: column; position: relative; min-width: 0; width: 100%;
    background: var(--sticker); color: var(--sticker-ink);
    border: 0; border-radius: 3px; padding: 5px 5px 7px;
    box-shadow: var(--lift); cursor: pointer; font: inherit; text-align: center;
    transform: rotate(var(--tilt, 0deg));
    transition: transform .14s ease, box-shadow .14s ease;
  }
  .st .pic {
    display: block; width: 100%; aspect-ratio: 1; border-radius: 1px;
    overflow: hidden; background: var(--shade);
  }
  .st .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .st .no { font-size: 9px; color: var(--sticker-sub); margin-top: 4px; line-height: 1.4; }
  .st .nm {
    font-family: var(--klee); font-weight: 600; font-size: 11.5px; line-height: 1.32;
    overflow-wrap: anywhere; word-break: keep-all;
  }
  .st:hover, .st:focus-visible {
    transform: rotate(0deg) translateY(-4px) scale(1.05);
    box-shadow: var(--lift-hi); z-index: 40;
  }

  /* まだ うまっていないマス／消した番号のマス */
  .slot {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    width: 100%; min-height: 108px; padding: 8px; font: inherit;
    background: transparent; border: 2px dashed transparent; border-radius: 4px;
    color: var(--tome-muted); cursor: pointer;
  }
  .slot .ghostpic { width: 52%; aspect-ratio: 1; border-radius: 3px; background: var(--tome-line); opacity: .5; }
  .slot .plus { font-size: 24px; line-height: 1; color: var(--tome-rule); }
  .slot .ghost { font-size: 11px; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
  .slot.blank { border-color: var(--tome-line); }
  .slot.blank.next { border-color: var(--cover); background: rgba(255, 255, 255, .55); }
  .slot.blank.next .plus, .slot.blank.next .ghost { color: var(--cover); font-weight: 700; }
  .slot.blank:hover { border-color: var(--cover); }
  /* 消した番号。詰めないので、空いたままにしておく */
  .slot.gone { cursor: default; opacity: .38; }
  .slot.gone .ghostpic, .slot.gone .plus { display: none; }

  /* ページを めくる */
  .pager { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 14px; }
  .pager .turn {
    font: inherit; font-size: 20px; line-height: 1; width: 40px; height: 40px;
    border-radius: 50%; cursor: pointer; background: var(--card);
    border: 1px solid var(--tome-rule); color: var(--tome-ink);
  }
  .pager .turn:disabled { opacity: .3; cursor: default; }
  .pager .pnum { font-size: 13px; color: var(--tome-muted); font-variant-numeric: tabular-nums; }
  .tome.turn-fwd { animation: pgf .18s ease both; }
  .tome.turn-back { animation: pgb .18s ease both; }
  @keyframes pgf { to { transform: translateX(-10px); opacity: .25; } }
  @keyframes pgb { to { transform: translateX(10px); opacity: .25; } }

  /* ================= タイトルの札のふち ================= */
  .plate.f-simple { border-radius: 5px; }
  .plate.f-line { border-radius: 4px; position: relative; }
  .plate.f-line::after {
    content: ""; position: absolute; inset: 7px; border: 1.2px solid var(--plate-sub);
    border-radius: 2px; pointer-events: none;
  }
  .plate.f-kazari { border-radius: 5px; position: relative; }
  .plate.f-kazari::before {
    content: ""; position: absolute; inset: 6px; border: 1.6px solid var(--plate-sub);
    border-radius: 3px; pointer-events: none;
  }
  .plate.f-kazari::after {
    content: ""; position: absolute; inset: 10px; border: .8px solid var(--plate-sub);
    border-radius: 2px; opacity: .8; pointer-events: none;
  }

  /* ================= 記録ページ ================= */
  .big-st {
    background: var(--sticker); border-radius: 4px; padding: 9px 9px 13px;
    box-shadow: var(--lift); color: var(--sticker-ink); max-width: 420px;
    margin-inline: auto; transform: rotate(-.8deg);
  }
  .big-st .pic { display: block; aspect-ratio: 4 / 3; border-radius: 2px; overflow: hidden; background: var(--shade); }
  .big-st .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .big-st .no { font-size: 11px; color: var(--sticker-sub); margin-top: 9px; letter-spacing: .08em; }
  .big-st .nm { font-family: var(--klee); font-weight: 600; font-size: 22px; line-height: 1.35; overflow-wrap: anywhere; }

  dl.rec { margin: 20px auto 0; border-top: 2px solid var(--rule); max-width: 560px; }
  dl.rec > div { display: grid; grid-template-columns: 9em 1fr; gap: 2px 14px; padding-block: 11px; border-bottom: 1px solid var(--line); }
  dl.rec dt { font-size: 12px; color: var(--muted); }
  dl.rec dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  @media (max-width: 440px) { dl.rec > div { grid-template-columns: 1fr; } }

  /* ================= 入力 ================= */
  .fld { display: block; margin-top: 16px; }
  .fld .lb { font-size: 13px; color: var(--muted); }
  .fld input, .fld textarea {
    font: inherit; width: 100%; max-width: 100%; min-width: 0; margin-top: 5px; display: block;
    color: var(--ink); background: var(--field);
    border: 1px solid var(--rule); border-radius: 3px; padding: 10px 12px;
  }
  .fld input[type="date"] { -webkit-appearance: none; appearance: none; min-height: 46px; line-height: 1.4; }
  .fld textarea { resize: vertical; min-height: 72px; line-height: 1.7; }
  .fld input.big { font-family: var(--klee); font-weight: 600; font-size: 20px; }

  /* ================= 質問（縦一列） ================= */
  .wprog { display: flex; align-items: center; gap: 10px; }
  .wprog .n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .wprog .track { flex: 1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .wprog .track i { display: block; height: 100%; background: var(--cover); }

  .wphoto {
    display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover;
    background: var(--shade); border-radius: 3px; margin-top: 12px;
    box-shadow: var(--lift);
  }
  .ask {
    margin: 16px 0 2px; font-size: clamp(28px, 8vw, 38px);
    font-family: var(--maru); font-weight: 900; line-height: 1.3;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    font: inherit; font-size: 15px; padding: 10px 17px; cursor: pointer;
    border: 2px solid var(--rule); border-radius: 999px;
    background: var(--field); color: var(--ink);
  }
  .chip[aria-pressed="true"] { border-color: var(--cover); background: var(--cover); color: var(--cover-ink); }

  .cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 6px; margin-top: 14px; }
  .col {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: transparent; border: 0; padding: 0; font: inherit; cursor: pointer;
  }
  .col .dot {
    position: relative; width: 100%; max-width: 52px; aspect-ratio: 1; border-radius: 50%;
    /* くろ・しろ・はいいろ が紙に溶けないよう、全部に細い縁取りを入れる */
    box-shadow: inset 0 0 0 1.5px rgba(40, 32, 18, .45);
    display: flex; align-items: center; justify-content: center;
  }
  .col .dot.clear {
    background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #c2c7cb 25%, transparent 25% 75%, #c2c7cb 75%),
      linear-gradient(45deg, #c2c7cb 25%, transparent 25% 75%, #c2c7cb 75%);
    background-size: 14px 14px;
    background-position: 0 0, 7px 7px;
  }
  .col .tick {
    width: 25px; height: 25px; border-radius: 50%;
    background: var(--tome-ink); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; line-height: 1; font-weight: 700;
    opacity: 0; transform: scale(.6); transition: opacity .12s ease, transform .12s ease;
  }
  .col[aria-pressed="true"] .dot { box-shadow: inset 0 0 0 4px var(--tome-ink), 0 0 0 2px var(--tome-ink); }
  .col[aria-pressed="true"] .tick { opacity: 1; transform: none; }
  .col .cn { font-size: 11px; color: var(--muted); line-height: 1.3; word-break: keep-all; }
  .col[aria-pressed="true"] .cn { color: var(--ink); font-weight: 700; }

  .free { margin-top: 16px; }
  .free input {
    font: inherit; width: 100%; max-width: 100%; min-width: 0; display: block;
    color: var(--ink); background: var(--field);
    border: 1px solid var(--rule); border-radius: 3px; padding: 11px 13px;
  }
  .review {
    background: var(--field); border: 1px solid var(--line); border-radius: 3px;
    padding: 12px 14px; margin-top: 8px; white-space: pre-wrap; font-size: 14px; line-height: 1.7;
  }
  .review.none { color: var(--muted); }
  .wback {
    display: block; margin: 12px auto 0; font: inherit; font-size: 13px; color: var(--muted);
    background: transparent; border: 0; cursor: pointer; padding: 6px 10px;
  }
  .wback:hover { color: var(--ink); }

  /* ================= いろ と がら をえらぶ ================= */
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; margin-top: 8px; }
  .swatch {
    display: flex; flex-direction: column; align-items: stretch; gap: 5px;
    background: transparent; border: 3px solid transparent; border-radius: 4px;
    padding: 4px; font: inherit; cursor: pointer; color: var(--muted);
  }
  .swatch .sn { font-size: 11.5px; line-height: 1.3; text-align: center; word-break: keep-all; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 700; }

  .gars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 8px; margin-top: 8px; }
  .gar {
    display: flex; flex-direction: column; align-items: stretch; gap: 5px;
    background: transparent; border: 3px solid transparent; border-radius: 4px;
    padding: 4px; font: inherit; cursor: pointer; color: var(--muted);
  }
  /* 角から地の色がのぞかないよう、外枠は角なしで全面を塗る */
  .gar { position: relative; }
  .gar .sw { display: block; border-radius: 2px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .2); }
  .gar .sw svg { display: block; width: 100%; height: auto; }
  .gar .gn { font-size: 12.5px; line-height: 1.3; text-align: center; word-break: keep-all; }
  .gar .gnote { font-size: 10px; line-height: 1.3; text-align: center; color: var(--muted); word-break: keep-all; }
  .gar[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 700; }

  /* ================= 記録ページ（貼った写真と、観察／想像） ================= */
  .recwrap { position: relative; max-width: 420px; margin-inline: auto; }
  .recphoto {
    position: relative; background: var(--sticker); padding: 9px 9px 11px;
    box-shadow: var(--lift); transform: rotate(-1.1deg);
  }
  .recphoto img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--shade); }

  .reclabel {

    {name:"Sticker",art:"./assets/preset-collection.svg",note:"シールや紙ものをやさしく可愛く。",image:"./assets/theme-sticker.svg",color:6,theme:3,frame:2,font:2,icon:3,layout:"normal",titleSize:"medium",titleAlign:"center",buttonTheme:"pink"},
    {name:"Plush",art:"./assets/preset-collection.svg",note:"ぬいぐるみや小物の思い出に。",image:"./assets/theme-plush.svg",color:9,theme:5,frame:1,font:0,icon:4,layout:"relaxed",titleSize:"small",titleAlign:"center",buttonTheme:"ivory"},

  /* 旧データの置きかえ表。version 3 への更新で一度だけ使う。

  var OLD_COLOR = [0, 1, 2, 3, 3, 4, 4];

    for (i = 0; i < s.length; i++) { hash ^= s.charCodeAt(i); hash = (hash * 16777619) >>> 0; }

  function pinked(x, y, w, hh, tooth) {
    var nx = Math.max(4, Math.round(w / tooth)), ny = Math.max(3, Math.round(hh / tooth));
    var tx = w / nx, ty = hh / ny, d = tooth * 0.42, p = [], i;
    for (i = 0; i < nx; i++) p.push([x + i * tx, y], [x + (i + 0.5) * tx, y + d]);
    for (i = 0; i < ny; i++) p.push([x + w, y + i * ty], [x + w - d, y + (i + 0.5) * ty]);
    for (i = nx; i > 0; i--) p.push([x + i * tx, y + hh], [x + (i - 0.5) * tx, y + hh - d]);
    for (i = ny; i > 0; i--) p.push([x, y + i * ty], [x + d, y + (i - 0.5) * ty]);
    return p.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" ");
  }

    for (i = 0; i < ny; i++) p.push([100, 100 * i / ny], [100 - dx, 100 * (i + 0.5) / ny]);
    for (i = nx; i > 0; i--) p.push([100 * i / nx, 100], [100 * (i - 0.5) / nx, 100 - dy]);
    for (i = ny; i > 0; i--) p.push([0, 100 * i / ny], [dx, 100 * (i - 0.5) / ny]);

  function drawStripe(c, ph, W, H) {

      }

          cx + "," + (cy + dy / 2) + " " + (cx - dx / 2) + "," + cy +
          '" fill="' + (((i + j) % 2) ? c[1] : c[2]) + '"/>');
      }
    }

      g.push('<line x1="' + (i * dx) + '" y1="0" x2="' + (i * dx - W) + '" y2="' + H + '"/>');
    }

        if (ev.oldVersion < 2 && idb.objectStoreNames.contains("planets")) {

        if (ev.oldVersion >= 2 && ev.oldVersion < 4) restyle(txn, ev.oldVersion);

        b.color = OLD_COLOR[old] != null ? OLD_COLOR[old] : 0;

        /* version 4：番号5 が ふかみどり から あか に変わったので、みどり へ */
        if (Number(b.color) === 5) b.color = 2;

      cur.update(b);
      cur.continue();
    };

    bs.get(bookId).onsuccess = function (ev) {

      if (!b) { t.abort(); return; }
      data.bookId = bookId;
      data.no = b.nextNo || 1;

      b.nextNo = data.no + 1;

    a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1200)
  }

  /* 傾き・ずれ・重なり順は、すべて番号から決まる。毎回おなじ見え方になる。 */
  /* 傾きは番号から決まる。毎回おなじ角度になる。
     ずらしと重なり順は、シール同士が接触するのでやめた。 */
  function tilt(no) { return (((no * 37) % 7) - 3) * 0.9; }
  function todayISO() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function showDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    return m ? Number(m[1]) + "年" + Number(m[2]) + "月" + Number(m[3]) + "日" : (iso || "——");
  }
  function field(label, tag, opts) {
    var l = h("label", "fld");
    l.append(h("span", "lb", label));
    var input = document.createElement(tag);
    if (opts.type) input.type = opts.type;
    if (opts.cls) input.className = opts.cls;
    if (opts.value) input.value = opts.value;
    if (opts.ph) input.placeholder = opts.ph;
    if (opts.max) input.maxLength = opts.max;
    input.id = opts.id;
    l.append(input);
    return { label: l, input: input };
  }
  function cameraIcon() {
    return svgFrom('<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none"' +
      ' stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M3 8.5h4l1.6-2.5h6.8L17 8.5h4v11H3z"/><circle cx="12" cy="13.5" r="3.6"/></svg>');
  }

  /* かたちの選択肢に出す図形。抽象的な形だけで、題材の絵は描かない。 */
  var SHAPES = {
    "まる": '<circle cx="24" cy="24" r="15"/>',
    "しかく": '<rect x="10" y="10" width="28" height="28" rx="2"/>',
    "さんかく": '<path d="M24 8 40 39H8Z"/>',
    "ながい": '<rect x="5" y="19" width="38" height="10" rx="5"/>',
    "とがってる": '<path d="M24 6c4 13 10 16 10 22a10 10 0 0 1-20 0c0-6 6-9 10-22z"/>',
    "でこぼこ": '<path d="M13 17c-4-6 2-11 7-8 2-6 11-5 12 1 7-2 10 5 6 9 5 5 1 13-5 11-2 6-10 7-12 1-6 4-12-2-9-8-5-1-5-5-1-6z"/>'
  };
  function shapeIcon(name) {
    return svgFrom('<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"' +
      ' fill="currentColor" aria-hidden="true">' + (SHAPES[name] || SHAPES["まる"]) + "</svg>");
  }

  /* 標本ラベルらしい、手で引いたような波打つ罫 */
  function waveRule() {
    var w = h("div", "wave");
    w.append(svgFrom('<svg viewBox="0 0 240 7" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"' +
      ' fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">' +
      '<path d="M0 4.6q6-3.4 12 0t12 0q6-3.4 12 0t12 0q6-3.4 12 0t12 0q6-3.4 12 0t12 0q6-3.4 12 0t12 0' +
      'q6-3.4 12 0t12 0q6-3.4 12 0t12 0q6-3.4 12 0t12 0q6-3.4 12 0t12 0"/></svg>'));
    return w;
  }

  function picture(src) {
    var p = h("span", "pic");
    var img = document.createElement("img");
    img.src = src; img.alt = "";
    p.append(img);
    return p;
  }
  function go(hash) { location.hash = hash; }
  function setCover(co) {
    var root = document.documentElement.style;
    root.setProperty("--cover", co.bg);
    root.setProperty("--cover-ink", co.ink || "#ffffff");
  }

  /* シートを開くあいだ履歴を1つ積む。iPhone の戻る操作で、
     後ろの画面だけが変わってシートが浮いたまま残るのを防ぐ。 */
  var sheetGuard = false;

  function openSheet(node) {
    var fresh = veil.hidden;
    if (fresh) lastFocus = document.activeElement;
    veil.replaceChildren(node);
    veil.hidden = false;
    if (fresh && !sheetGuard) {
      sheetGuard = true;
      try { history.pushState({ sheet: true }, ""); } catch (e) { sheetGuard = false; }
    }
    /* 開いた最初だけ合わせる。質問を進めるたびに動かすと、
       選択肢を出したいところで キーボードが開いてしまう。 */
    if (fresh) {
      var f = veil.querySelector("input, textarea, button");
      if (f) f.focus();
    }
  }
  function closeSheet(fromPop) {
    veil.hidden = true;
    veil.replaceChildren();
    var had = sheetGuard;
    sheetGuard = false;
    if (had && !fromPop) { try { history.back(); } catch (e) {} }
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  window.addEventListener("popstate", function () {
    if (!veil.hidden) closeSheet(true);
  });
  veil.addEventListener("click", function (e) { if (e.target === veil) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !veil.hidden) closeSheet(); });

  /* 演出。短く、じゃまにならない長さに。動きを減らす設定では静かに出す。 */
  function calm() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  /* はじめての1件。シールが貼られ、紙吹雪が少しだけ舞う。 */
  function celebrate(entry) {
    var party = h("div", "party");
    party.id = "party";
    party.setAttribute("role", "status");

    var card = h("div", "party-card");
    var seal = h("div", "seal");
    var img = document.createElement("img");
    img.src = urlFor(entry); img.alt = "";
    seal.append(img, h("div", "cap", entry.name));
    card.append(seal);
    card.append(h("div", "ttl", "はじめての はっけん！"));
    card.append(h("div", "sub", "ずかんの 1ページめが うまりました"));
    party.append(card);

    if (!calm()) {
      var tone = [cover(0).set[0], "#edc55e", "#e8a7bd", "#7dbed2", "#a9d6b4"];
      for (var i = 0; i < 26; i++) {
        var f = h("i", "conf");
        f.style.left = (Math.random() * 100).toFixed(1) + "%";
        f.style.background = tone[i % tone.length];
        f.style.animationDuration = (1.1 + Math.random() * 0.7).toFixed(2) + "s";
        f.style.animationDelay = (Math.random() * 0.35).toFixed(2) + "s";
        f.style.setProperty("--spin", (360 + Math.random() * 540).toFixed(0) + "deg");
        party.append(f);
      }
    }

    function shut() {
      if (party.parentNode) party.remove();
      clearTimeout(timer);
    }
    party.addEventListener("click", shut);
    var timer = setTimeout(shut, calm() ? 1400 : 2400);
    document.body.append(party);
  }

  /* 5こ、10こ、と区切りのたびに、小さく知らせる。 */
  var MILESTONES = [5, 10, 20, 30, 50, 100];
  function milestone(count) {
    if (MILESTONES.indexOf(count) < 0) return;
    var t = h("div", "badge-toast");
    t.setAttribute("role", "status");
    t.append(h("span", null, count + "こ あつめた！"));
    document.body.append(t);
    setTimeout(function () { if (t.parentNode) t.remove(); }, 2400);
  }

  /* ================= 画面 ================= */

  function route() {
    var hash = location.hash.replace(/^#/, "");
    var m = /^\/b\/([^/]+)\/e\/(\d+)$/.exec(hash);
    if (m) return { view: "entry", bookId: m[1], no: Number(m[2]) };
    m = /^\/b\/([^/]+)$/.exec(hash);
    if (m) return { view: "book", bookId: m[1] };
    if (hash === "/storage") return { view: "storage" };
    return { view: "shelf" };
  }

  function render() {
    if (!db) return Promise.resolve();
    var r = route();
    document.documentElement.setAttribute("data-view", r.view);
    bar.hidden = true;
    if (r.view === "book") return renderBook(r.bookId);
    if (r.view === "entry") return renderEntry(r.bookId, r.no);
    if (r.view === "storage") return renderStorage();
    return renderShelf();
  }

  function renderShelf() {
    return store.books().then(function (books) {
      setCover(COVERS[0]);
      app.replaceChildren();

      var mast = h("div", "masthead");
      mast.append(h("h1", "display", "みつけた図鑑"));
      mast.append(h("p", "lead", "見つけたものを、じぶんの ずかんに ためていきます。"));
      app.append(mast);

      if (!books.length) {
        var ft = h("div", "firsttime");
        ft.append(h("p", null, "まず、ずかんを ひとつ つくりましょう。"));
        ft.append(h("span", null,
          "くるま、はな、レゴ、ペットボトルの キャップ。あつめたい ものなら なんでも。"));
        app.append(ft);
      }

      var shelf = h("div", "shelf");
      books.forEach(function (b) {
        var card = h("button", "bk");
        card.type = "button";
        var cv = h("span", "cv");
        cv.append(coverArt(b));
        var cp = h("span", "cvplate");
        cp.append(h("span", "t display", b.title), h("span", "s", "MITSUKETA ZUKAN"));
        cv.append(cp);
        card.append(cv, h("span", "bkmeta", (b.count || 0) + "こ あつめた"));
        card.setAttribute("aria-label", b.title + "、" + (b.count || 0) + "こ");
        card.addEventListener("click", function () { go("#/b/" + b.id); });
        shelf.append(card);
      });

      var add = h("button", "newbk");
      add.type = "button";
      add.append(h("span", "plus", "＋"), h("span", null, "あたらしい ずかんを つくる"));
      add.addEventListener("click", openNewBook);
      shelf.append(add);
      app.append(shelf);

      app.append(h("p", "footnote",
        "きろくは この たんまつの 中だけに のこります。ほかの たんまつからは 見られません。"));
    });
  }

  var PER_PAGE = 9;   /* 1ページ 3×3。紙の図鑑らしい密度にそろえる */

  function renderBook(bookId) {
    return Promise.all([store.book(bookId), store.entries(bookId)]).then(function (out) {
      var b = out[0], list = out[1];
      app.replaceChildren();

      if (!b) {
        app.append(h("h1", "display", "その ずかんは ありません"));
        var gone = h("a", "back", "← 本だなへ もどる");
        gone.href = "#/";
        app.append(gone);
        return;
      }

      setCover(cover(b.color));
      var back = h("a", "back", "← 本だな");
      back.href = "#/";
      app.append(back);

      /* 番号でマスが決まる。欠番はそのまま空くので、ページの位置は動かない。 */
      var byNo = Object.create(null);
      list.forEach(function (e) { byNo[e.no] = e; });
      var next = b.nextNo || 1;
      var maxNo = list.length ? list[list.length - 1].no : 0;
      var pages = Math.max(1, Math.ceil(Math.max(next, maxNo) / PER_PAGE));
      var page = Math.min(Math.max(bookPage[bookId] || 1, 1), pages);
      bookPage[bookId] = page;

      var tome = h("div", "tome");
      tome.style.setProperty("--tint", cover(b.color).set[0]);
      ["tl", "tr", "bl", "br"].forEach(function (k) { tome.append(h("span", "tape " + k)); });

      /* 表紙の柄を細い帯にして、ページの上に通す。外と中をつなぐ。 */
      var band = h("div", "headband");
      band.append(svgFrom('<svg viewBox="0 0 300 26" preserveAspectRatio="none"' +
        ' xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
        patternSVG(b.color, b.theme, 2, 300, 26) + "</svg>"));
      tome.append(band);

      var inner = h("div", "tomein");
      var plate = h("div", "plate f-" + frameOf(b.frame).key);
      if (frameOf(b.frame).key === "zig") plate.style.clipPath = edgeClip(26, 4, 1.2, 9);
      plate.append(h("h1", "display", b.title));
      plate.append(h("div", "sub", (b.count || 0) + "こ あつめた"));
      inner.append(plate, waveRule());

      var grid = h("div", "pagegrid");
      for (var i = 0; i < PER_PAGE; i++) {
        (function (no) {
          var e = byNo[no];
          var cell = h("div", "cell");
          if (e) {
            var st = h("button", "st");
            st.type = "button";
            st.style.setProperty("--tilt", tilt(e.no) + "deg");
            st.append(picture(urlFor(e)), h("span", "no num", pad(e.no)), h("span", "nm", e.name));
            st.setAttribute("aria-label", "No." + pad(e.no) + " " + e.name);
            st.addEventListener("click", function () { go("#/b/" + b.id + "/e/" + e.no); });
            cell.append(st);
          } else if (no < next) {
            /* 消した番号。詰めないので、ここは空いたままにする。 */
            var gone2 = h("div", "slot gone");
            gone2.append(h("span", "ghost", pad(no)));
            gone2.setAttribute("aria-label", "No." + pad(no) + " は ありません");
            cell.append(gone2);
          } else {
            var blank = h("button", "slot blank" + (no === next ? " next" : ""));
            blank.type = "button";
            blank.append(h("span", "ghostpic"), h("span", "plus", "\uff0b"), h("span", "ghost", pad(no)));
            blank.setAttribute("aria-label", "No." + pad(next) + " に ついかする");
            blank.addEventListener("click", function () { startCapture(b.id); });
            cell.append(blank);
          }
          grid.append(cell);
        })((page - 1) * PER_PAGE + i + 1);
      }
      inner.append(grid);

      /* ページを めくる */
      var pager = h("div", "pager");
      var prev = h("button", "turn", "‹");
      prev.type = "button";
      prev.setAttribute("aria-label", "まえの ページ");
      prev.disabled = page <= 1;
      prev.addEventListener("click", function () { turnTo(b.id, page - 1, "back"); });
      var nextBtn = h("button", "turn", "›");
      nextBtn.type = "button";
      nextBtn.setAttribute("aria-label", "つぎの ページ");
      nextBtn.disabled = page >= pages;
      nextBtn.addEventListener("click", function () { turnTo(b.id, page + 1, "fwd"); });
      pager.append(prev, h("span", "pnum num", page + " / " + pages), nextBtn);
      inner.append(pager);

      tome.append(inner);
      app.append(tome);

      var acts = h("div", "acts");
      var del = h("button", "del", "この ずかんを 消す");
      del.type = "button";
      var armed = false;
      del.addEventListener("click", function () {
        if (!armed) { armed = true; del.classList.add("armed"); del.textContent = "ほんとうに 消す（きろくも ぜんぶ）"; return; }
        del.disabled = true;
        store.dropBook(b.id).then(function () {
          list.forEach(function (e) {
            if (urls[e.id]) { URL.revokeObjectURL(urls[e.id]); }
            delete urls[e.id];
          });
          go("#/");
        }, function () { del.disabled = false; del.textContent = "消せません"; });
      });
      acts.append(del);
      app.append(acts);

      bar.hidden = false;
      barBtn.replaceChildren(cameraIcon(), document.createTextNode("しゃしんを とる"));
      barBtn.onclick = function () { startCapture(b.id); };
    });
  }

  /* どのページを開いているかは、図鑑ごとに覚えておく（保存はしない） */
  var bookPage = Object.create(null);

  function turnTo(bookId, page, dir) {
    bookPage[bookId] = page;
    var t = app.querySelector(".tome");
    if (t && !calm()) {
      t.classList.add(dir === "back" ? "turn-back" : "turn-fwd");
      setTimeout(function () { render(); }, 180);
      return;
    }
    render();
  }

  function renderEntry(bookId, no) {
    return Promise.all([store.book(bookId), store.entries(bookId)]).then(function (out) {
      var b = out[0], list = out[1];
      var e = list.filter(function (x) { return x.no === no; })[0];
      app.replaceChildren();
      if (b) setCover(cover(b.color));

      var back = h("a", "back", b ? "← " + b.title : "← 本だな");
      back.href = b ? "#/b/" + bookId : "#/";
      app.append(back);

      if (!e) {
        app.append(h("h1", "display", "その きろくは ありません"));
        return;
      }

      /* 貼った写真と、番号と名前の札 */
      var wrap = h("div", "recwrap");
      var ph = h("div", "recphoto");
      ["tl", "tr"].forEach(function (k) { ph.append(h("span", "tape " + k)); });
      var img = document.createElement("img");
      img.src = urlFor(e); img.alt = "";
      ph.append(img);
      var lbl = h("div", "reclabel");
      lbl.append(h("div", "no", "No." + pad(e.no)), h("div", "nm", e.name));
      wrap.append(ph, lbl);
      app.append(wrap);

      var metas = h("dl", "metas");
      [["見つけた日", showDate(e.date)], ["見つけた ところ", e.place || "——"]].forEach(function (pair) {
        var row = h("div", "metarow");
        row.append(h("span", "bul"), h("dt", null, pair[0]), h("dd", null, pair[1]));
        metas.append(row);
      });
      app.append(metas);

      /* 観察と想像は、囲みを分け、点の色でも見分けられるようにする。統合しない。 */
      var lenses = h("div", "lenses");
      [["obs", "見て わかったこと", e.observed], ["ima", "そうぞうした こと", e.imagined]].forEach(function (t) {
        var box = h("section", "lens " + t[0]);
        var hd = h("div", "hd");
        hd.append(h("i"), document.createTextNode(t[1]));
        box.append(hd, h("div", t[2] ? "bd" : "bd empty", t[2] || "まだ かいていません"));
        lenses.append(box);
      });
      app.append(lenses);

      var acts = h("div", "acts");
      acts.style.maxWidth = "420px";
      acts.style.marginInline = "auto";
      var edit = h("button", "edit", "へんしゅう");
      edit.type = "button";
      edit.addEventListener("click", function () { openEditForm(bookId, e); });
      var del = h("button", "del", "この ページを けす");
      del.type = "button";
      var armed = false;
      del.addEventListener("click", function () {
        if (!armed) { armed = true; del.classList.add("armed"); del.textContent = "ほんとうに けす"; return; }
        del.disabled = true;
        store.dropEntry(bookId, e.id).then(function () {
          if (urls[e.id]) { URL.revokeObjectURL(urls[e.id]); }
          delete urls[e.id];
          go("#/b/" + bookId);
        }, function () { del.disabled = false; del.textContent = "けせません"; });
      });
      acts.append(edit, del);
      app.append(acts);
    });
  }

  /* 保存場所の診断。#/storage で開く。記録が残らない端末で、原因を確かめるため。
     何も書きかえない。 */
  function renderStorage() {
    app.replaceChildren();
    var back = h("a", "back", "← 本だな");
    back.href = "#/";
    app.append(back, h("h1", "display", "きろくの ほぞんばしょ"));
    var dl = h("dl", "metas");
    app.append(dl);
    function row(k, v) {
      var r = h("div", "metarow");
      r.append(h("span", "bul"), h("dt", null, k), h("dd", null, v));
      dl.append(r);
    }
    var framed = true;
    try { framed = window.self !== window.top; } catch (e) { framed = true; }
    row("ばしょ", location.origin);
    row("うめこみ表示", framed ? "はい（ほかの ページの中で うごいている）" : "いいえ");
    var inf = store.info();
    row("データベース", inf.name + " ／ 版 " + inf.version + "（このページは 版 " + inf.expected + "）");
    var st = navigator.storage || {};
    return Promise.all([
      store.books(),
      store.countEntries(),
      st.persisted ? st.persisted()["catch"](function () { return null; }) : Promise.resolve(null),
      st.estimate ? st.estimate()["catch"](function () { return null; }) : Promise.resolve(null)
    ]).then(function (o) {
      row("図鑑", o[0].length + " さつ");
      row("きろく", o[1] + " こ");
      row("ながく のこす", o[2] === true ? "オン" : o[2] === false ? "オフ（容量が たりないと ブラウザが けすことがある）" : "わからない");
      if (o[3] && o[3].quota) {
        row("つかっている量", Math.round(o[3].usage / 1024) + " KB ／ 上限 " + Math.round(o[3].quota / 1048576) + " MB");
      }
    });
  }

  /* ================= 図鑑をつくる ================= */

  function openNewBook() {
    var c = h("div", "card");
    c.setAttribute("role", "dialog");
    c.setAttribute("aria-modal", "true");
    c.append(h("h2", "display", "あたらしい ずかん"));

    /* まっさらな表紙が、打った文字と 選んだ色・柄で その場で変わっていく。
       作る前に「自分の一冊」が見えていることを、いちばん大事にする。 */
    var chosen = 0, chosenTheme = 0, chosenFrame = 0;
    setCover(COVERS[chosen]);
    var ritual = h("div", "ritual");
    var stage = h("div", "stage");
    var cv = h("div", "cv");
    stage.append(cv);
    var capt = h("div", "capt", "なまえを いれると、ひょうしに でます");
    ritual.append(stage, capt);
    c.append(ritual);

    function paintCover() {
      cv.replaceChildren();
      var title = fTitle.input.value.trim();
      if (!title) {
        var blank = h("div", "blankcv", "まっさらな ひょうし");
        cv.append(blank);
        return;
      }
      cv.append(coverArt({ id: "new", title: title, color: chosen, theme: chosenTheme, frame: chosenFrame }));
      var cp = h("span", "cvplate");
      cp.append(h("span", "t display", title), h("span", "s", "MITSUKETA ZUKAN"));
      cv.append(cp);
    }

    var fTitle = field("ずかんの なまえ（24もじまで）", "input",
      { id: "nb-title", cls: "big", ph: "ずかんの なまえを いれてね", max: 24 });
    fTitle.input.addEventListener("input", function () {

  function shareEntry(book,entry){

    if(entry.kanji)bits.push(entry.kanji);
    if(entry.date)bits.push(showDate(entry.date));

      return navigator.share({title:title,text:text})["catch"](function(){})

    return Promise.resolve(false)
  }

  function openEntryForm(bookId, photo) {
    var url = URL.createObjectURL(photo);
    var answers = Object.create(null);      /* key -> ["あか", "しろ"] */
    var form = { name: "", date: todayISO(), place: "", imagined: "" };
    var step = 0;                           /* 0..QUESTIONS.length（最後は仕上げ）*/
    var total = QUESTIONS.length + 1;

    var card = h("div", "card");
    card.setAttribute("role", "dialog");
    card.setAttribute("aria-modal", "true");

    function quit() { URL.revokeObjectURL(url); closeSheet(); }

    function topRow(labelText) {
      var prog = h("div", "wprog");
      prog.append(h("span", "n num", (step + 1) + " / " + total));
      var track = h("span", "track");
      var fill = h("i");
      fill.style.width = Math.round((step + 1) / total * 100) + "%";
      track.append(fill);
      prog.append(track);
      prog.setAttribute("role", "img");
      prog.setAttribute("aria-label", total + "つのうち " + (step + 1) + "つめ");
      card.append(prog);

      var img = document.createElement("img");
      img.className = "wphoto";
      img.src = url; img.alt = "";
      card.append(img);

      if (labelText) card.setAttribute("aria-label", labelText);
    }

    function backRow() {
      if (step === 0) return;
      var b = h("button", "wback", "← まえの しつもんへ もどる");
      b.type = "button";
      b.addEventListener("click", function () { step -= 1; draw(); });
      card.append(b);
    }

    function drawQuestion() {
      var q = QUESTIONS[step];
      var picked = (answers[q.key] || []).slice();
      var chosen = [], free = "";
      var names = [];
      if (q.pick === "color") names = COLORS.map(function (c) { return c.name; });
      else if (q.pick === "word") names = q.choices || [];
      /* 保存済みの答えを、選択肢と自由入力に分け直す */
      picked.forEach(function (p) {
        if (names.indexOf(p) >= 0) chosen.push(p); else free = free ? free + "、" + p : p;
      });

      card.replaceChildren();
      topRow(q.ask);
      card.append(h("h2", "ask display", q.ask));
      if (q.pick) card.append(h("p", "qhelp", "あてはまるものを えらんでね（いくつでも えらべます）"));

      function toggle(btn, name) {
        var at = chosen.indexOf(name);
        if (at >= 0) chosen.splice(at, 1); else chosen.push(name);
        btn.setAttribute("aria-pressed", String(at < 0));
      }

      if (q.pick === "color") {
        var cols = h("div", "cols");
        COLORS.forEach(function (co) {
          var b = h("button", "col");
          b.type = "button";
          b.setAttribute("aria-pressed", String(chosen.indexOf(co.name) >= 0));
          var dot = h("span", co.clear ? "dot clear" : "dot");
          if (!co.clear) dot.style.background = co.bg;
          dot.append(h("span", "tick", "\u2713"));
          b.append(dot, h("span", "cn", co.name));
          b.addEventListener("click", function () { toggle(b, co.name); });
          cols.append(b);
        });
        card.append(cols);
      } else if (q.pick === "word") {
        var shapes = h("div", "shapes");
        (q.choices || []).forEach(function (w) {
          var b = h("button", "shape");
          b.type = "button";
          b.setAttribute("aria-pressed", String(chosen.indexOf(w) >= 0));
          b.append(shapeIcon(w), h("span", "sl", w), h("span", "badge", "\u2713"));
          b.addEventListener("click", function () { toggle(b, w); });
          shapes.append(b);
        });
        card.append(shapes);
      }

      var wrapFree = h("div", "free");
      var input = document.createElement("input");
      input.type = "text";
      input.id = "q-" + q.key;
      input.maxLength = 60;
      input.value = free;
      input.placeholder = q.ph || "";
      input.setAttribute("aria-label", q.ask);
      wrapFree.append(input);
      card.append(wrapFree);

      function keep() {
        var parts = chosen.slice();
        var t = input.value.trim();
        if (t) parts.push(t);
        if (parts.length) answers[q.key] = parts; else delete answers[q.key];
      }
      function next() { keep(); step += 1; draw(); }

      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); next(); }
      });

      var acts = h("div", "acts");
      var go1 = h("button", "go", "つぎへ");
      go1.type = "button";
      go1.addEventListener("click", next);
      var skip = h("button", null, "とばす");
      skip.type = "button";
      skip.addEventListener("click", function () {
        delete answers[q.key];
        step += 1;
        draw();
      });
      acts.append(go1, skip);
      card.append(acts);
      backRow();
    }

    function drawFinish() {
      card.replaceChildren();
      topRow("さいごに");
      card.append(h("h2", "ask display", "なまえを つけよう"));

      var fName = field("なまえ", "input", { id: "f-name", cls: "big", ph: "ざらざらぼし", max: 24 });
      fName.input.value = form.name;
      var fDate = field("見つけた日", "input", { id: "f-date", type: "date", value: form.date });
      var fPlace = field("見つけた ところ", "input", { id: "f-place", ph: "こうえん", max: 30 });
      fPlace.input.value = form.place;
      var fImg = field("そうぞうした こと", "textarea", { id: "f-imagined", max: 300 });
      fImg.input.value = form.imagined;
      card.append(fName.label, fDate.label, fPlace.label, fImg.label);

      var seen = composeObserved(answers);
      var lab = h("label", "fld");
      lab.append(h("span", "lb", "見て わかったこと"));
      card.append(lab);
      card.append(h("div", seen ? "review" : "review none",
        seen || "（しつもんを ぜんぶ とばしました）"));

      var acts = h("div", "acts");
      var save = h("button", "go", "ずかんに くわえる");
      save.type = "button";
      var cancel = h("button", null, "やめる");
      cancel.type = "button";
      cancel.addEventListener("click", quit);
      acts.append(save, cancel);
      card.append(acts);
      backRow();

      function hold() {
        form.name = fName.input.value.trim();
        form.date = fDate.input.value || todayISO();
        form.place = fPlace.input.value.trim();
        form.imagined = fImg.input.value.trim();
      }
      [fName, fDate, fPlace, fImg].forEach(function (f) {
        f.input.addEventListener("change", hold);
      });

      function fail(msg) {
        var w = card.querySelector(".warn") || h("div", "warn");
        w.className = "warn";
        w.textContent = msg;
        if (!w.parentNode) card.insertBefore(w, acts);
      }

      save.addEventListener("click", function () {
        hold();
        if (!form.name) { fail("なまえを つけてください。"); fName.input.focus(); return; }
        save.disabled = true; cancel.disabled = true; save.textContent = "しまっています…";
        /* IndexedDB に入れるので、素の object に写し替えておく */
        var kept = {};
        Object.keys(answers).forEach(function (k) { kept[k] = answers[k].slice(); });
        toBuffer(photo).then(function (buf) {
          return store.addEntry(bookId, {
            id: "e-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7),
            name: form.name,
            date: form.date,
            place: form.place,
            observed: composeObserved(answers),
            imagined: form.imagined,
            answers: kept,             /* 組み立て前の答え。表示には使わない */
            photoBuf: buf,
            photoType: photo.type || "image/jpeg",
            createdAt: Date.now()
          });
        }).then(function (saved) {
          URL.revokeObjectURL(url);
          closeSheet();
          return render().then(function () {
            /* 1ページめが うまった瞬間だけは、特別にする。
               そのあとは区切りの数で、小さく知らせる。 */
            if (saved && saved.no === 1) { celebrate(saved); return; }
            return store.book(bookId).then(function (b) { milestone((b && b.count) || 0); });
          });
        })["catch"](function (e) {
          save.disabled = false; cancel.disabled = false; save.textContent = "ずかんに くわえる";
          fail(e && e.name === "QuotaExceededError"
            ? "この たんまつが いっぱいです。いらない きろくを 消すと、また くわえられます。"
            : "しまえませんでした。もう一度 おしてください。");
        });
      });
    }

    function draw() {
      if (step >= QUESTIONS.length) drawFinish(); else drawQuestion();
      openSheet(card);
      veil.scrollTop = 0;
    }

    draw();
  }



  function exportBackup(){
    return store.books().then(function(books){
      return Promise.all(books.map(function(b){
        return store.entries(b.id).then(function(entries){return{book:b,entries:entries}})
      }))
    }).then(function(groups){
      var payload={
        type:"mitsuketa-zukan-backup",
        version:1,
        createdAt:new Date().toISOString(),
        books:groups.map(function(g){return g.book}),
        entries:[]
      };
      groups.forEach(function(g){
        g.entries.forEach(function(src){
          var e={};
          Object.keys(src).forEach(function(k){
            if(k!=="photoBuf"&&k!=="photo")e[k]=src[k]
          });
          if(src.photoBuf)e.photoBase64=bufferToBase64(src.photoBuf);
          payload.entries.push(e)
        })
      });
      var d=new Date(),p=function(n){return String(n).padStart(2,"0")};
      var name="zukan-backup-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+".json";
      var json=JSON.stringify(payload),n=nativeApi();
      if(n&&n.shareBackup){
        return n.shareBackup(name,json).then(function(){
          nativeHaptic("success");
          return true
        })["catch"](function(){
          downloadBlob(new Blob([json],{type:"application/json"}),name);
          return false
        })
      }
      downloadBlob(new Blob([json],{type:"application/json"}),name);
      return true
    })
  }

    if(n===5)return'url("./assets/texture-linen.svg")';
    if(n===1)return"repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 1px,transparent 1px 7px),repeating-linear-gradient(-45deg,rgba(0,0,0,.025) 0 1px,transparent 1px 8px)";
    if(n===2)return"repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 5px),repeating-linear-gradient(0deg,rgba(0,0,0,.02) 0 1px,transparent 1px 6px)";
    if(n===3)return"linear-gradient(135deg,rgba(255,255,255,.025),transparent 45%,rgba(0,0,0,.035))";
    if(n===4)return"radial-gradient(circle at 6px 6px,rgba(255,255,255,.035) 0 1px,transparent 1.4px)";
    if(n===6)return"radial-gradient(ellipse at 30% 30%,rgba(255,255,255,.035) 0 1px,transparent 1.8px),radial-gradient(ellipse at 70% 70%,rgba(0,0,0,.035) 0 1px,transparent 1.8px)";

  function openNewBook(){
    var c=h("div","card new-book-sheet");
    c.setAttribute("role","dialog");
    c.setAttribute("aria-modal","true");

    var head=h("div","new-book-head");
    head.append(
      h("p","new-book-eyebrow","NEW COLLECTION"),
      h("h2","display","新しい図鑑")
    );
    c.append(head);

    var draft={
      title:"",
      subtitle:"",
      color:3,
      theme:0,
      frame:1,
      font:0,
      icon:5,
      layout:"normal",
      nameMode:"both",
      titleSize:"medium",
      titleAlign:"center",
      buttonTheme:"pink",
      customBg:"",
      customAccent:"",
      customInk:""
    };

    var preview=h("div","design-preview new-book-preview");
    c.append(preview);

    var title=field("タイトル","input",{
      id:"new-title",
      cls:"big",
      ph:"草花図鑑",
      max:24
    });
    var sub=field("サブタイトル（任意）","input",{
      id:"new-subtitle",
      ph:"Nature / 大切なものを、少しずつ。",
      max:48
    });
    c.append(title.label,sub.label);

    var themeLabel=h("div","new-book-section-title","デザインテーマ");
    c.append(themeLabel);

    var pg=h("div","preset-grid new-book-presets");

    function paint(){
      draft.title=title.input.value.trim()||"わたしの図鑑";
      draft.subtitle=sub.input.value.trim();
      applyButtonTheme(c,draft);
      preview.replaceChildren(makeBookFace(draft,true))
    }

    BOOK_PRESETS.forEach(function(theme,i){
      var bt=h("button","preset-card"+(i===0?" active":""));
      bt.type="button";
      bt.setAttribute("aria-label",theme.name);

      var thumb=document.createElement("img");
      thumb.className="preset-thumb";
      thumb.src=theme.image;
      thumb.alt="";

      bt.append(
        thumb,
        h("span","preset-name",theme.name),
        h("span","preset-note",theme.note)
      );

      bt.addEventListener("click",function(){
        nativeHaptic("light");
        applyPreset(draft,theme);
        Array.prototype.forEach.call(pg.children,function(node,j){
          node.classList.toggle("active",j===i)
        });
        paint()
      });

      pg.append(bt)
    });

    c.append(pg);

    var help=h("p","new-book-help","色・素材・装丁・アイコン・ボタンテーマは、作成後にいつでも変更できます。");
    c.append(help);

    var acts=h("div","acts new-book-actions");
    var make=h("button","go","この図鑑をつくる");
    var cancel=h("button",null,"やめる");
    make.type=cancel.type="button";
    cancel.addEventListener("click",closeSheet);
    acts.append(make,cancel);
    c.append(acts);

    title.input.addEventListener("input",paint);
    sub.input.addEventListener("input",paint);

    make.addEventListener("click",function(){
      var name=title.input.value.trim();
      if(!name){
        title.input.focus();
        return
      }

      make.disabled=true;
      cancel.disabled=true;
      make.textContent="つくっています…";

      store.createBook(name,draft.color,draft.theme,draft.frame).then(function(book){
        return store.updateBook(book.id,{
          subtitle:sub.input.value.trim(),
          font:draft.font,
          icon:draft.icon,
          layout:draft.layout,
          nameMode:draft.nameMode||"both",
          titleSize:draft.titleSize||"medium",
          titleAlign:draft.titleAlign||"center",
          buttonTheme:draft.buttonTheme||"pink",
          customBg:"",
          customAccent:"",
          customInk:""
        })
      }).then(function(book){
        nativeHaptic("success");
        closeSheet(true);
        go("#/b/"+book.id)
      },function(){
        make.disabled=false;
        cancel.disabled=false;
        make.textContent="もう一度ためす"
      })
    });

    paint();
    openSheet(c);

    setTimeout(function(){
      title.input.focus()
    },80)
  }

  function openEntryForm(bookId,photo){
    var url=URL.createObjectURL(photo);
    var c=h("div","card");c.setAttribute("role","dialog");c.setAttribute("aria-modal","true");
    c.append(h("h2","display","コレクションに追加"));
    var img=document.createElement("img");img.className="record-sheet-photo";img.src=url;img.alt="選んだ写真";c.append(img);

    var nm=field("名前","input",{id:"new-entry-name",cls:"big",ph:"お気に入りの名前",max:24});
    var kn=field("漢字・別名（任意）","input",{id:"new-entry-kanji",ph:"蒲公英 / 宇宙飛行士 など",max:32});
    var dt=field("日付","input",{id:"new-entry-date",type:"date",value:todayISO()});
    var pl=field("見つけた・入手した場所","input",{id:"new-entry-place",ph:"公園 / お店 / 旅行先 など",max:40});
    var tg=field("タグ","input",{id:"new-entry-tags",ph:"花, 春, ピンク",max:120});
    var ob=field("見て気づいたこと（任意）","textarea",{id:"new-entry-observed",max:500});
    var im=field("思ったこと・ストーリー（任意）","textarea",{id:"new-entry-imagined",max:300});
    c.append(nm.label,kn.label,dt.label,pl.label,tg.label,h("p","tag-help","タグは自由です。レゴ、限定、旅行、推し、春など、自分が探しやすい言葉を付けられます。"),ob.label,im.label);

    var acts=h("div","acts"),save=h("button","go","コレクションに追加"),cancel=h("button",null,"やめる");
    save.type=cancel.type="button";
    cancel.addEventListener("click",function(){URL.revokeObjectURL(url);closeSheet()});
    acts.append(save,cancel);c.append(acts);

    save.addEventListener("click",function(){
      var name=nm.input.value.trim();if(!name){nm.input.focus();return}
      save.disabled=true;cancel.disabled=true;save.textContent="保存しています…";
      toBuffer(photo).then(function(buf){
        return store.addEntry(bookId,{
          id:"e-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7),
          name:name,kanji:kn.input.value.trim(),date:dt.input.value||todayISO(),place:pl.input.value.trim(),
          tags:parseTags(tg.input.value),observed:ob.input.value.trim(),imagined:im.input.value.trim(),
          photoBuf:buf,photoType:photo.type||"image/jpeg",createdAt:Date.now()
        })
      }).then(function(){
        nativeHaptic("success");
        URL.revokeObjectURL(url);closeSheet();render()
      })["catch"](function(err){
        save.disabled=false;cancel.disabled=false;save.textContent="コレクションに追加";
        var w=c.querySelector(".warn")||h("div","warn");
        w.textContent=err&&err.name==="QuotaExceededError"?"この端末の保存容量がいっぱいです。":"保存できませんでした。もう一度お試しください。";
        if(!w.parentNode)c.insertBefore(w,acts)
      })
    });
    openSheet(c)
  }

  function renderCollections(){
    renderAppNav("collections");app.replaceChildren();
    return store.books().then(function(books){
      var head=h("div","screen-head"),copy=h("div");copy.append(h("h1",null,"図鑑"),h("p",null,"つくった本を一覧で見る"));
      var add=h("button","ghost-btn","＋ 新しい図鑑");add.type="button";add.addEventListener("click",openNewBook);head.append(copy,add);app.append(head);
      if(!books.length){app.append(h("div","empty-collection","まだ図鑑がありません。"));return}
      var grid=h("div","book-grid");
      books.forEach(function(b){
        var bt=h("button","book-grid-card");bt.type="button";bt.append(makeBookFace(b,true));
        bt.append(h("div","book-grid-title",b.title),h("div","book-grid-meta",(b.count||0)+" items"));
        bt.addEventListener("click",function(){go("#/b/"+b.id)});grid.append(bt)
      });
      app.append(grid,h("div","app-nav-spacer"))
    })
  }

  function renderGlobalSearch(){
    renderAppNav("search");app.replaceChildren();
    var head=h("div","screen-head"),copy=h("div");copy.append(h("h1",null,"さがす"),h("p",null,"すべての図鑑から検索"));head.append(copy);app.append(head);
    var box=h("label","global-search"),ico=maskIcon("./assets/nav-search.svg","search-mask"),input=document.createElement("input");
    input.type="search";input.placeholder="名前・漢字・タグ・場所";input.setAttribute("aria-label","すべての図鑑を検索");box.append(ico,input);app.append(box);
    var results=h("div","search-results"),empty=h("div","empty-collection","検索したい言葉を入力してください。");app.append(results,empty,h("div","app-nav-spacer"));

    return store.books().then(function(books){
      return Promise.all(books.map(function(b){return store.entries(b.id).then(function(es){return{book:b,entries:es}})}))
    }).then(function(groups){
      var all=[];
      groups.forEach(function(g){g.entries.forEach(function(e){all.push({book:g.book,entry:e})})});
      function draw(){
        var q=(input.value||"").trim().toLowerCase();results.replaceChildren();
        if(!q){empty.hidden=false;empty.textContent="検索したい言葉を入力してください。";return}
        var hits=all.filter(function(x){
          var e=x.entry,hay=[e.name||"",e.kanji||"",e.place||"",Array.isArray(e.tags)?e.tags.join(" "):"",x.book.title||""].join(" ").toLowerCase();
          return hay.indexOf(q)>=0
        }).slice(0,60);
        if(!hits.length){empty.hidden=false;empty.textContent="条件に合う記録が見つかりません。";return}
        empty.hidden=true;
        hits.forEach(function(x){
          var e=x.entry,b=x.book,row=h("div","entry-row"),img=document.createElement("img");img.className="entry-photo";img.src=urlFor(e);img.alt="";
          var op=h("button","entry-open"),names=displayNames(b,e);op.type="button";op.append(h("div","entry-name",names.main));if(names.sub)op.append(h("div","entry-alias",names.sub));
          op.append(h("div","entry-meta",b.title+(e.place?"　•　"+e.place:"")));op.addEventListener("click",function(){go("#/b/"+b.id+"/e/"+e.no)});
          var hi=h("span","heart-btn"+(e.favorite?" on":""));hi.append(maskIcon("./assets/icon-heart.svg","heart-mask"));row.append(img,op,hi);results.append(row)
        })
      }
      input.addEventListener("input",draw);input.focus()
    })
  }

  /* ================= 起動 ================= */

  window.addEventListener("hashchange", function () { render(); });

  /* データベースが開くまで画面を空にしない。開けない端末でも見出しは出る。 */
  document.documentElement.setAttribute("data-view", "shelf");
  app.append(h("p", "lead", "ライブラリをひらいています…"));

  if("serviceWorker" in navigator&&!(window.NativeZukan&&window.NativeZukan.isNative)){
    window.addEventListener("load",function(){navigator.serviceWorker.register("./service-worker.js").catch(function(){})})
  }

  store.open().then(function (d) {
    db = d;
    /* 端末の容量が足りなくなったとき、ブラウザが勝手に消さないよう頼んでおく。
       断られても動きは変わらない。 */
    if (navigator.storage && navigator.storage.persist && navigator.storage.persisted) {
      navigator.storage.persisted().then(function (on) {
        if (!on) return navigator.storage.persist();
      })["catch"](function () {});
    }
    return render();
  })["catch"](function (e) {
    app.replaceChildren();
    app.append(h("h1", "display", "きろくを ひらけませんでした"));
    app.append(h("p", "lead",
      "この ブラウザでは、きろくを しまう場所が つかえないようです。" +
      "プライベートモードを やめるか、べつの ブラウザで ひらいてください。"));
    app.append(h("p", "note", "（" + ((e && e.name) || "error") + "）"));
  });
})();
