name: Assemble generated UI images

on:
  push:
    branches:
      - native-app-v1
    paths:
      - "_image_chunks/**"

permissions:
  contents: write

concurrency:
  group: assemble-generated-ui-images
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
        with:
          ref: native-app-v1
          fetch-depth: 0

      - name: Assemble WebP files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f _image_chunks/READY ]; then
            echo "No complete image set to assemble."
            exit 0
          fi

          assemble() {
            local prefix="$1"
            local output="$2"
            cat "_image_chunks/${prefix}."* | base64 --decode > "$output"
            test -s "$output"
            test "$(head -c 4 "$output")" = "RIFF"
            test "$(dd if="$output" bs=1 skip=8 count=4 status=none)" = "WEBP"
          }

          assemble welcome assets/welcome-discovery.webp
          assemble empty assets/empty-album.webp
          assemble pro assets/pro-premium.webp
          assemble collage assets/collection-collage.webp

          rm -rf _image_chunks

      - name: Commit rebuilt images
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/welcome-discovery.webp assets/empty-album.webp assets/pro-premium.webp assets/collection-collage.webp _image_chunks
          git commit -m "Rebuild generated UI image assets"
          git push origin HEAD:native-app-v1
