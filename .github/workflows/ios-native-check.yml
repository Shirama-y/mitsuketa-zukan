name: iOS native build check

concurrency:
  group: ios-native-app-v1
  cancel-in-progress: true

on:
  push:
    branches:
      - native-app-v1
  pull_request:
    branches:
      - system-update-v2
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "index.html"
      - "assets/**"
      - "resources/**"
      - "scripts/**"
      - ".github/workflows/ios-native-check.yml"

jobs:
  ios-build:
    name: Build iOS simulator app
    runs-on: macos-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Create iOS project
        run: npm run native:ios:add

      - name: Verify privacy and App Store metadata
        run: |
          plutil -p ios/App/App/Info.plist | grep NSCameraUsageDescription
          plutil -p ios/App/App/Info.plist | grep NSPhotoLibraryUsageDescription
          plutil -p ios/App/App/Info.plist | grep ITSAppUsesNonExemptEncryption
          grep -q "図鑑に写真を登録するためにカメラを使用します。" ios/App/App/Info.plist
          test -f ios/App/App/PrivacyInfo.xcprivacy
          plutil -lint ios/App/App/PrivacyInfo.xcprivacy
          grep -q "PrivacyInfo.xcprivacy" ios/App/App.xcodeproj/project.pbxproj

      - name: Compile for iPhone Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath /tmp/zukan-derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch on iPhone Simulator
        timeout-minutes: 3
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for devices in data["devices"].values():
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator")
          ')

          echo "Using simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true

          BOOTED=0
          for i in $(seq 1 30); do
            STATE=$(xcrun simctl list devices -j | python3 -c '
          import json, sys
          target = sys.argv[1]
          data = json.load(sys.stdin)
          for devices in data["devices"].values():
              for device in devices:
                  if device.get("udid") == target:
                      print(device.get("state", "Unknown"))
                      raise SystemExit
          print("Missing")
          ' "$DEVICE_ID")
            echo "Simulator state: $STATE"
            if [ "$STATE" = "Booted" ]; then
              BOOTED=1
              break
            fi
            sleep 2
          done

          if [ "$BOOTED" != "1" ]; then
            xcrun simctl list devices
            echo "Simulator did not boot within 60 seconds."
            exit 1
          fi

          APP_PATH=$(find /tmp/zukan-derived/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)
          test -d "$APP_PATH"

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.dodolabo.mitsuketazukan
          sleep 6
          xcrun simctl io "$DEVICE_ID" screenshot /tmp/zukan-native-simulator.png

      - name: Upload native simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: mitsuketa-zukan-native-screenshot
          path: /tmp/zukan-native-simulator.png
          retention-days: 7

      - name: Package Xcode project
        run: |
          ditto -c -k --sequesterRsrc --keepParent ios /tmp/mitsuketa-zukan-ios-project.zip

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: mitsuketa-zukan-ios-project
          path: /tmp/mitsuketa-zukan-ios-project.zip
          retention-days: 7
