name: Basic app check

on:
  pull_request:
  push:
    branches:
      - main
      - night-library

jobs:
  syntax:
    name: HTML / JavaScript check
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run simple check
        run: node tools/syntax-check.mjs

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local app
        run: |
          python3 -m http.server 8777 > /tmp/zukan-server.log 2>&1 &
          sleep 2

      - name: Browser smoke test
        run: node tools/ui-smoke.mjs

      - name: Upload iPhone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-ui-preview
          path: |
            /tmp/zukan-375.png
            /tmp/zukan-430.png
          if-no-files-found: ignore
