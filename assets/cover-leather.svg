<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720">
<defs>
  <filter id="leather">
    <feTurbulence type="fractalNoise" baseFrequency=".28" numOctaves="4" seed="19"/>
    <feDiffuseLighting surfaceScale="1.2" diffuseConstant=".9" lighting-color="#fff"><feDistantLight azimuth="225" elevation="55"/></feDiffuseLighting>
    <feBlend mode="soft-light" in2="SourceGraphic"/>
  </filter>
  <linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".08"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".11"/></linearGradient>
</defs>
<rect width="480" height="720" fill="#777"/>
<rect width="480" height="720" filter="url(#leather)" opacity=".28"/>
<rect width="480" height="720" fill="url(#v)"/>
</svg>